name: kokage
version: 0.1.0.0
github: "pe200012/kokage"
license: BSD-3-Clause
author: "pe200012"
maintainer: "1326263755@qq.com"
copyright: "2025 pe200012"

extra-source-files:
  - README.md
  - CHANGELOG.md

description: ukagaka baseware for Linux

dependencies:
  - base >= 4.7 && < 5
  - relude # alternative Prelude
  - aeson # JSON serialization for preferences
  - async
  - text
  - containers
  - bytestring
  - iconv # Shift-JIS encoding support
  - vector
  - megaparsec # parsing
  - gi-gtk4 # GTK4 bindings (4.0.8 from extra-deps)
  - gi-gdk4 # GTK4 Gdk
  - gi-gtk4-layer-shell # Wayland layer-shell support (runtime detected)
  - gi-pango # Pango text rendering (for balloon text wrapping)
  - gi-pangocairo # PangoCairo for text rendering on Cairo surfaces
  - gi-gdkx114 # GDK X11 bindings for always-on-top
  - gi-cairo # Cairo GI bindings (for Region type)
  - gi-cairo-render # Cairo rendering
  - gi-cairo-connector
  - gi-gdkpixbuf # image loading
  - gi-gio
  - gi-glib
  - haskell-gi-base # GI base types
  - X11 # X11 bindings for window hints
  - filepath
  - directory
  - mtl
  - transformers
  - process # Wine subprocess management
  - base64-bytestring # Base64 encoding for IPC
  - time # Time for debugging
  - reactive-banana # FRP
  - reactive-banana-gi-gtk # FRP with GTK
  - zip-archive # NAR/ZIP archive handling
  - text-builder # Efficient text building for SHIORI protocol
  - random # Random number generation for animations

ghc-options:
  - -Wall
  - -Werror
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints
  - -fllvm
  - -O2

library:
  source-dirs: src
  dependencies:
  - name: base
    mixin:
      - hiding (Prelude)
  - name: relude
    mixin:
      - (Relude as Prelude)
      - ""

executables:
  kokage:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - kokage
      - optparse-applicative

  shiori-test:
    main: Main.hs
    source-dirs: app-shiori-test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - kokage
      - time

  animation-test:
    main: Main.hs
    source-dirs: app-animation-test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - kokage
      - text
      - containers
      - directory
      - filepath
      - gi-gtk4
      - gi-gdk4
      - gi-gdkpixbuf
      - gi-gio
      - gi-glib
      - haskell-gi-base
      - transformers

  balloon-test:
    main: Main.hs
    source-dirs: app-balloon-test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - kokage
      - text
      - gi-gtk4
      - gi-gdk4
      - gi-gio
      - gi-glib
      - haskell-gi-base

tests:
  kokage-test:
    main: Spec.hs
    source-dirs: test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    build-tools:
      - hspec-discover
    dependencies:
      - kokage
      - hspec
      - hspec-megaparsec
      - temporary
